<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <!-- Dark GitHub background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect for the Octocat silhouette -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle pulse animation for cursor -->
    <style>
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fade-in { animation: fadeIn 1.2s ease-in forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .slide-in { animation: slideIn 1s ease-out forwards; }
      @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <!-- Decorative commit graph dots (left side) -->
  <g fill="#238636" opacity="0.7">
    <circle cx="40" cy="40" r="4"/>
    <circle cx="40" cy="80" r="4"/>
    <circle cx="40" cy="120" r="4"/>
    <circle cx="40" cy="160" r="4"/>
    <circle cx="40" cy="200" r="4"/>
    <circle cx="80" cy="40" r="6"/>
    <circle cx="80" cy="120" r="4"/>
    <circle cx="80" cy="200" r="4"/>
  </g>
  <g stroke="#238636" stroke-width="2" fill="none" opacity="0.5">
    <line x1="40" y1="40" x2="40" y2="200"/>
    <line x1="80" y1="40" x2="80" y2="200"/>
    <line x1="40" y1="80" x2="80" y2="120"/>
    <line x1="80" y1="40" x2="40" y2="40"/>
  </g>

  <!-- GitHub Octocat-inspired silhouette (right decorative area) -->
  <g transform="translate(740, 30)" opacity="0.12" fill="#58a6ff" filter="url(#glow)">
    <!-- Simple Octocat shape -->
    <circle cx="75" cy="60" r="52"/>
    <ellipse cx="75" cy="110" rx="35" ry="18"/>
    <!-- tentacles -->
    <ellipse cx="30" cy="100" rx="12" ry="22" transform="rotate(-20 30 100)"/>
    <ellipse cx="120" cy="100" rx="12" ry="22" transform="rotate(20 120 100)"/>
    <ellipse cx="18" cy="130" rx="10" ry="18" transform="rotate(-35 18 130)"/>
    <ellipse cx="132" cy="130" rx="10" ry="18" transform="rotate(35 132 130)"/>
    <ellipse cx="50" cy="148" rx="10" ry="18" transform="rotate(-10 50 148)"/>
    <ellipse cx="100" cy="148" rx="10" ry="18" transform="rotate(10 100 148)"/>
    <!-- eyes -->
    <circle cx="58" cy="52" r="9" fill="#0d1117"/>
    <circle cx="92" cy="52" r="9" fill="#0d1117"/>
    <circle cx="60" cy="50" r="3" fill="#58a6ff"/>
    <circle cx="94" cy="50" r="3" fill="#58a6ff"/>
  </g>

  <!-- Code snippet block (center-right) -->
  <rect x="460" y="40" width="280" height="145" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Dots -->
  <circle cx="480" cy="58" r="5" fill="#ff5f57"/>
  <circle cx="497" cy="58" r="5" fill="#febc2e"/>
  <circle cx="514" cy="58" r="5" fill="#28c840"/>
  <line x1="460" y1="70" x2="740" y2="70" stroke="#30363d" stroke-width="1"/>

  <!-- Code lines with syntax highlighting -->
  <!-- Line 1 -->
  <text x="476" y="92" font-family="'Courier New', monospace" font-size="12" fill="#ff7b72">def</text>
  <text x="504" y="92" font-family="'Courier New', monospace" font-size="12" fill="#d2a8ff"> greet</text>
  <text x="548" y="92" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">(name):</text>
  <!-- Line 2 -->
  <text x="492" y="109" font-family="'Courier New', monospace" font-size="12" fill="#79c0ff">return</text>
  <text x="538" y="109" font-family="'Courier New', monospace" font-size="12" fill="#a5d6ff"> f</text>
  <text x="549" y="109" font-family="'Courier New', monospace" font-size="12" fill="#a5d6ff">"</text>
  <text x="557" y="109" font-family="'Courier New', monospace" font-size="12" fill="#a5d6ff">Hey, </text>
  <text x="591" y="109" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">{name}!</text>
  <text x="637" y="109" font-family="'Courier New', monospace" font-size="12" fill="#a5d6ff">"</text>
  <!-- Line 3 blank -->
  <!-- Line 4 -->
  <text x="476" y="126" font-family="'Courier New', monospace" font-size="12" fill="#8b949e"># commit: build great things</text>
  <!-- Line 5 -->
  <text x="476" y="143" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">greet(</text>
  <text x="516" y="143" font-family="'Courier New', monospace" font-size="12" fill="#a5d6ff">"Łukasz"</text>
  <text x="572" y="143" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">)</text>
  <!-- Line 6: output -->
  <text x="476" y="160" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">&gt; Hey, Łukasz!</text>
  <!-- cursor -->
  <rect x="476" y="168" width="8" height="13" fill="#58a6ff" class="cursor" rx="1"/>

  <!-- Main title text -->
  <text x="130" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">Łukasz Kusy</text>
  <text x="130" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8b949e">Software Engineer  ·  Problem Solver  ·  Lifelong Learner</text>

  <!-- Skill pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600">
    <!-- Java -->
    <rect x="130" y="134" width="50" height="22" rx="11" fill="#21262d" stroke="#ed8b00" stroke-width="1"/>
    <text x="155" y="149" text-anchor="middle" fill="#ed8b00">Java</text>
    <!-- TypeScript -->
    <rect x="188" y="134" width="85" height="22" rx="11" fill="#21262d" stroke="#3178c6" stroke-width="1"/>
    <text x="230" y="149" text-anchor="middle" fill="#3178c6">TypeScript</text>
    <!-- Python -->
    <rect x="281" y="134" width="62" height="22" rx="11" fill="#21262d" stroke="#3572a5" stroke-width="1"/>
    <text x="312" y="149" text-anchor="middle" fill="#3572a5">Python</text>
    <!-- Groovy -->
    <rect x="351" y="134" width="62" height="22" rx="11" fill="#21262d" stroke="#4298b8" stroke-width="1"/>
    <text x="382" y="149" text-anchor="middle" fill="#4298b8">Groovy</text>
  </g>

  <!-- GitHub stats bar -->
  <g transform="translate(130, 170)">
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8b949e">
      <tspan x="0" dy="0">📦 11 repositories</tspan>
      <tspan dx="20">🔗 linkedin.com/in/lukaszkusy</tspan>
    </text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="215" width="900" height="5" rx="0" fill="#238636" opacity="0.6"/>
  <rect x="0" y="215" width="300" height="5" fill="#58a6ff" opacity="0.8"/>
  <rect x="0" y="215" width="100" height="5" fill="#3fb950" opacity="0.9"/>
</svg>
